<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Message for You ❤️</title>
    <style>
        body {
    font-family: 'Arial', sans-serif;
    text-align: center;
    background-color: #ffe4e1;
    padding: 20px;
}

#container {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
}

button {
    background-color: #ff4081;
    color: white;
    border: none;
    padding: 10px 15px;
    margin: 10px;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background-color: #e91e63;
}

    </style>
</head>
<body>
    <div id="container">
        <h2 id="message">Hey Shiny, here is something I wanted to ask from a long time, but situations never where in my favour!!</h2>
        <button onclick="nextStep(1)">What is it? 🤔</button>
        <div id="response"></div>
    </div>

    <script>
       function nextStep(step) {
    let response = document.getElementById("response");

    if (step === 1) {
        response.innerHTML = `<p>It's something I've been meaning to ask you... 💭</p>
                              <button onclick="nextStep(2)">Tell me! 👀</button>`;
    } else if (step === 2) {
        response.innerHTML = `<p>We've had amazing times together, right? 😄</p>
                              <button onclick="nextStep(3)">Of course! 😊</button>
                              <button onclick="nextStep(4)">Hmm, maybe? 🤨</button>`;
    } else if (step === 3) {
        response.innerHTML = `<p>Well, I was wondering... ❤️</p>
                              <button onclick="nextStep(5)">Yes? 😍</button>`;
    } else if (step === 4) {
        response.innerHTML = `<p>Haha, stop teasing me! You know we have. 😜</p>
                              <button onclick="nextStep(3)">Fine, we have! 😂</button>`;
    } else if (step === 5) {
        response.innerHTML = `<p>Will you be my Valentine? 💖</p>
                              <button onclick="finalResponse(true)">YES! 🥰</button>
                              <button onclick="finalResponse(false)">Umm... 🤔</button>`;
    }
}

function finalResponse(accepted) {
    let response = document.getElementById("response");
    let message = accepted
        ? "YAY! 🎉 I knew you'd say yes! Can't wait! 💃🕺"
        : "Oh no! 😢 Well, I'll still get you chocolate! 🍫";

    response.innerHTML = `<p>${message}</p>`;

    // Generate WhatsApp message
    let userMessage = accepted
        ? "OMG YES! I'm your Valentine! ❤️"
        : "Umm... I need to think about this. 🤔";

    let phoneNumber = "+916301052834"; // Replace with your WhatsApp number
    let whatsappLink = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(userMessage)}`;

    response.innerHTML += `<br><a href="${whatsappLink}" target="_blank">
                              <button>Send Response on WhatsApp 📩</button>
                           </a>`;
}


    </script>
</body>
</html>
